<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
    <link rel="manifest" href="site.webmanifest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Trip Travel & Tours Agency</title>
    <meta name="title" content="Trip Travel & Tours Agency" />
    <meta name="description" content="Discover amazing travel destinations, earn rewards while traveling, and explore the world with Trip Travel & Tours. Your journey to extraordinary adventures starts here." />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://triptravelandtours.com/" />
    <meta property="og:title" content="Trip Travel & Tours Agency" />
    <meta property="og:description" content="Discover amazing travel destinations, earn rewards while traveling, and explore the world with Trip Travel & Tours. Your journey to extraordinary adventures starts here." />
    <meta property="og:image" content="https://triptravelandtours.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Trip Travel & Tours" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://triptravelandtours.com/" />
    <meta property="twitter:title" content="Trip Travel & Tours Agency" />
    <meta property="twitter:description" content="Discover amazing travel destinations, earn rewards while traveling, and explore the world with Trip Travel & Tours. Your journey to extraordinary adventures starts here." />
    <meta property="twitter:image" content="https://triptravelandtours.com/og-image.jpg" />
    <style>
      /* Aggressive FOUC prevention - hide everything until React hydrates */
      body {
        overflow: hidden !important;
      }
      body.hydrated {
        overflow: auto !important;
      }

      #root {
        visibility: hidden !important;
        opacity: 0 !important;
      }
      #root.ready {
        visibility: visible !important;
        opacity: 1 !important;
        transition: opacity 0.2s ease-in;
      }

      /* Full-screen loading overlay - highest z-index */
      #app-loader {
        position: fixed !important;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 999999 !important;
        opacity: 1;
        transition: opacity 0.3s ease-out;
      }
      #app-loader.loaded {
        opacity: 0;
        pointer-events: none;
      }

      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid #f3f4f6;
        border-top-color: #1e40af;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Loading screen -->
    <div id="app-loader">
      <div class="loader-spinner"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
